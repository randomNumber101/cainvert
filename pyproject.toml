[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cainvert"
version = "0.2.0"
description = "Exact preimage-tree catalogs and an evaluation protocol for cellular-automata inversion (a controlled benchmark for recursive models)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.22.0",
    "pyarrow>=10.0.0",
    "duckdb>=0.9.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
torch = [
    "torch>=1.12.0",
]
hub = [
    "huggingface_hub>=0.20.0",
]
sat2d = [
    "python-sat",
]
all = [
    "torch>=1.12.0",
    "huggingface_hub>=0.20.0",
    "python-sat",
    "pytest>=7.0.0",
]

[project.scripts]
cainvert = "cainvert.cli.main:main"

[tool.setuptools.packages.find]
include = ["cainvert*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
